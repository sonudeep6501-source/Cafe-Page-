<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaskaran's Cafe Menu</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>SARDAR JI CAFE</h1>
        <p class="established">Est. 2026</p>
        <hr>
        <section>
          <h2>Coffee</h2>
          <img src="coffee.jpg" alt="coffee icon"/>
          <article class="item">
            <p class="flavor">French Vanilla</p><p class="price">₹150</p>
          </article>
          <article class="item">
            <p class="flavor">Caramel Macchiato</p><p class="price">₹200</p>
          </article>
          <article class="item">
            <p class="flavor">Pumpkin Spice</p><p class="price">₹180</p>
          </article>
          <article class="item">
            <p class="flavor">Hazelnut</p><p class="price">₹220</p>
          </article>
          <article class="item">
            <p class="flavor">Mocha</p><p class="price">₹190</p>
          </article>
        </section>
        <section>
          <h2>Desserts</h2>
          <img src="Dessertsimg.png" alt="pie icon"/>
          <article class="item">
            <p class="dessert">Donut</p><p class="price">₹80</p>
          </article>
          <article class="item">
            <p class="dessert">Cherry Pie</p><p class="price">₹120</p>
          </article>
          <article class="item">
            <p class="dessert">Cheesecake</p><p class="price">₹150</p>
          </article>
          <article class="item">
            <p class="dessert">Cinnamon Roll</p><p class="price">₹100</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <address>
          <p>
            <a href="#" target="_blank">Follow us on Instagram</a>
          </p>
          <p class="address">Main Market, Shahabad Markanda, Haryana 136135</p>
        </address>
      </footer>
    </div>
  </body>
</html>
